name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (Test & Build)
  # ==========================================
  ci:
    name: Lint & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Creates a blank/dummy .env so nothing crashes during build
      - name: Create Dummy .env for CI
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Validate Dockerfile Build
        run: docker build -t web-rag:test .

  # ==========================================
  # JOB 2: Continuous Deployment (Render.com)
  # ==========================================
  cd:
    name: Deploy to Render
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"